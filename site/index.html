<title>Alternative Investment Signal Engine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a research terminal over a drifting candlestick field — sticky top bar,
   ticker tape, then one routed view. Brass accent; green/red only ever mean direction. */
:root{
  --bg:#081520; --bg-2:#0c1d2a; --panel:#0f2232; --panel-2:#132a3c; --line:#1f3a4f;
  --fg:#e4edf2; --muted:#8ea6b6; --faint:#5d7789;
  --accent:#d9a441; --accent-ink:#1b1305; --info:#5fb2d9;
  --up:#37c391; --down:#f0645c; --warn:#e8b04a;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e8eef2; --bg-2:#dde6ec; --panel:#f7fafb; --panel-2:#eef3f6; --line:#c5d3dc;
    --fg:#0b1d29; --muted:#4b6575; --faint:#7b93a2;
    --accent:#94660c; --accent-ink:#fff8ea; --info:#1f6f99;
    --up:#0f7d55; --down:#c2332b; --warn:#9a6a08;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e8eef2; --bg-2:#dde6ec; --panel:#f7fafb; --panel-2:#eef3f6; --line:#c5d3dc;
  --fg:#0b1d29; --muted:#4b6575; --faint:#7b93a2;
  --accent:#94660c; --accent-ink:#fff8ea; --info:#1f6f99;
  --up:#0f7d55; --down:#c2332b; --warn:#9a6a08;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:15px;line-height:1.55;min-height:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg-2)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.shell{position:relative;z-index:1}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg-2) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:18px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand-mark{width:28px;height:28px;flex:none}
.brand-name{font-family:var(--display);font-stretch:118%;font-weight:800;letter-spacing:.06em;font-size:15px;line-height:1.05;text-transform:uppercase}
.brand-name small{display:block;font-family:var(--mono);font-weight:500;font-stretch:100%;letter-spacing:.08em;font-size:10px;color:var(--muted)}
nav.main{display:flex;gap:2px;flex-wrap:wrap}
nav.main a{text-decoration:none;font-size:13.5px;font-weight:500;color:var(--muted);padding:7px 11px;border-radius:7px}
nav.main a:hover{color:var(--fg);background:var(--panel-2)}
nav.main a[aria-current="page"]{color:var(--fg);background:var(--panel-2);box-shadow:inset 0 -2px 0 var(--accent)}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--panel);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.chip.owner{border-color:var(--accent);color:var(--accent)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.chip.live .dot{background:var(--up);animation:pulse 2.4s infinite}
.chip.stale .dot{background:var(--warn)}
.updated-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.03em}
.updated-line b{color:var(--fg);font-weight:600}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

.tape{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent);overflow:hidden}
.tape-inner{display:flex;align-items:center;height:36px}
.tape-label{flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:0 14px 0 max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);height:100%;display:flex;align-items:center;background:var(--bg-2)}
.tape-track{overflow:hidden;flex:1;min-width:0;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tape-run{display:inline-flex;white-space:nowrap;animation:tape 70s linear infinite}
.tape:hover .tape-run{animation-play-state:paused}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tick{display:inline-flex;gap:8px;align-items:baseline;padding:0 20px;font-family:var(--mono);font-size:12.5px;border-right:1px solid var(--line)}
.tick b{font-weight:600;letter-spacing:.04em} .tick span{color:var(--muted)} .tick em{font-style:normal}

main{padding-block:28px 64px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--panel));margin-bottom:22px;font-size:14px}
.banner b{color:var(--warn);flex:none}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5.2vw,54px);font-stretch:112%;font-weight:800;line-height:1.03;letter-spacing:-.01em}
h2{font-size:clamp(20px,2.6vw,26px);font-stretch:108%;font-weight:700;line-height:1.15}
h3{font-size:15.5px;font-stretch:105%;font-weight:700;letter-spacing:.01em;line-height:1.25}
p{margin:0}
.lede{color:var(--muted);font-size:16.5px;max-width:64ch}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.section{display:flex;flex-direction:column;gap:16px;margin-top:40px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel{background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--r);padding:18px}

.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:end}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:color-mix(in srgb,var(--panel) 94%,transparent);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:12.5px;color:var(--muted)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;text-decoration:none;padding:15px 16px;border-radius:var(--r);border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(6px);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tkr{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.05em}
.card-name{font-size:13px;color:var(--muted)}
.big{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.readings{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:12.5px}
.readings .num{text-align:right}
.readings .lbl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spark{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.note{display:flex;flex-direction:column;gap:4px;padding-block:12px;border-top:1px solid var(--line)}
.note:first-child{border-top:0;padding-top:0}
.note .meta{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.05em}
.note p{white-space:pre-wrap;font-size:14px}

/* signals */
.cat-head{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.cat-head .eyebrow{color:var(--muted)}
.sig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sig{display:flex;flex-direction:column;gap:9px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(6px);min-width:0}
.sig.empty-sig{background:color-mix(in srgb,var(--panel) 70%,transparent)}
.sig-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.cat{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.auto{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
.badge.owner{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.sig-why{font-size:13.5px;color:var(--muted)}
.sig-read{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px;border-top:1px dashed var(--line)}
.sig-read .val{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.sig-read .chg{font-family:var(--mono);font-size:12px}
.sig-read .spark{max-width:130px}
.sig-src{font-size:12px;color:var(--faint)}
.sig-wait{font-size:13px;color:var(--faint);padding-top:6px;border-top:1px dashed var(--line)}
details.add{font-size:13px}
details.add summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none}
details.add summary::-webkit-details-marker{display:none}
details.add form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
details.add form .full{grid-column:1/-1}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.cat-block{display:flex;flex-direction:column;gap:12px}
.catalog .sig h3{font-size:17px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.dl dt{color:var(--muted);font-weight:500} .dl dd{margin:0}
.read-guide{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.read-guide div{padding:8px 10px;border-radius:8px;border:1px solid var(--line)}

/* company */
.co-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.co-tkr{font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);display:flex;flex-direction:column;gap:4px}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .d{font-family:var(--mono);font-size:12px}
.chart-box{position:relative}
.chart-box svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:var(--mono);box-shadow:0 8px 24px rgba(0,0,0,.25);min-width:170px;z-index:5}
.callout{border-left:3px solid var(--accent);padding:10px 14px;background:color-mix(in srgb,var(--accent) 8%,var(--panel));border-radius:0 8px 8px 0;font-size:14.5px}
.summary-row{display:flex;gap:10px;flex-wrap:wrap}
.summary-row .pill{font-size:12.5px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:color-mix(in srgb,var(--panel) 92%,transparent)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
td.wrap-cell{white-space:normal;min-width:220px}
th{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--panel-2)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid}
.pill.good{color:var(--up);border-color:color-mix(in srgb,var(--up) 50%,transparent);background:color-mix(in srgb,var(--up) 12%,transparent)}
.pill.bad{color:var(--down);border-color:color-mix(in srgb,var(--down) 50%,transparent);background:color-mix(in srgb,var(--down) 12%,transparent)}
.pill.neutral{color:var(--muted);border-color:var(--line)}
.pill.gold{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pill.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 50%,transparent);background:color-mix(in srgb,var(--info) 10%,transparent)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.howto .panel{display:flex;flex-direction:column;gap:6px;padding:14px 16px}
.howto b{font-family:var(--display);font-stretch:105%;font-size:15px}
details.adv summary{cursor:pointer;font-weight:600;color:var(--muted)}

.record{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:start;padding:14px 16px;border-top:1px solid var(--line)}
.fc:first-child{border-top:0}
.fc .why{font-size:14px;white-space:pre-wrap}
.fc .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.fc-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

form.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
form.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-row label{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--fg);cursor:pointer;background:var(--bg-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--down)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;max-width:72ch}
ol.steps li::marker{font-family:var(--mono);color:var(--accent)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:14px;max-width:min(420px,calc(100vw - 32px));box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.bad{border-left-color:var(--down)}
.foot{border-top:1px solid var(--line);padding-block:20px;color:var(--faint);font-size:12.5px}
.foot .wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.skeleton{height:220px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel) 0%,var(--panel-2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.console-tabs{display:flex;gap:6px;flex-wrap:wrap}

@media (max-width:860px){
  .hero,.two{grid-template-columns:minmax(0,1fr)}
  form.grid,.read-guide{grid-template-columns:minmax(0,1fr)}
  .fc{grid-template-columns:minmax(0,1fr)}
  .fc-side{align-items:flex-start}
  .actions{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){
  .tape-run{animation:none} .tape-track{overflow-x:auto}
  .chip.live .dot{animation:none} .card,.skeleton{transition:none;animation:none}
}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="shell">
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="#markets" aria-label="Signal Engine home">
        <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
          <rect x="1" y="1" width="26" height="26" rx="6" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
          <line x1="8" y1="8" x2="8" y2="20" stroke="var(--fg)" stroke-width="1.2"/><rect x="6" y="11" width="4" height="6" fill="var(--fg)"/>
          <line x1="14" y1="6" x2="14" y2="18" stroke="var(--accent)" stroke-width="1.2"/><rect x="12" y="8" width="4" height="7" fill="var(--accent)"/>
          <line x1="20" y1="10" x2="20" y2="22" stroke="var(--fg)" stroke-width="1.2"/><rect x="18" y="13" width="4" height="6" fill="none" stroke="var(--fg)" stroke-width="1.2"/>
        </svg>
        <span class="brand-name">Signal Engine<small>Alternative investment research</small></span>
      </a>
      <nav class="main" id="nav" aria-label="Sections"></nav>

const SIG = Object.fromEntries(SIGNALS.map(s => [s.id, s]));

/* ==================================================================== STATE */
const S = {
  data: null, loadedAsset: undefined, dataError: null, lastChecked: null,
  dataset: null, forecasts: [], notes: [], series: {}, dbCompanies: [],
  fcReady: false, notesReady: false, seriesReady: false,
  isOwner: false, preview: false, me: null, db: null, assets: null, live: false,
  boardSignal: "wiki_views", coSignal: "wiki_views", scSignal: "wiki_views",

const ownerView = () => S.isOwner && !S.preview;
const CHECK_EVERY_MS = 30 * 60 * 1000;

/* ================================================================== HELPERS */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "svg") el.innerHTML = v;       // only strings this page builds, text passed through esc()
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const fmtSigned = (x, d) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d);
const pctLog = v => isNum(v) ? fmtSigned((Math.exp(v) - 1) * 100, 1) + "%" : "—";
const pctRaw = v => isNum(v) ? fmtSigned(v * 100, 1) + "%" : "—";
const pts = v => isNum(v) ? fmtSigned(v * 100, 1) + " pts" : "—";
const dir = v => !isNum(v) ? "flat" : v > 0 ? "up" : v < 0 ? "down" : "flat";
const arrow = v => !isNum(v) ? "" : v > 0 ? "▲ " : v < 0 ? "▼ " : "";
const f2 = v => isNum(v) ? fmtSigned(v, 2) : "—";
const pct0 = v => isNum(v) ? Math.round(v * 100) + "%" : "—";
function fmtVal(v) {
  if (!isNum(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return (v / 1e6).toFixed(2) + "M";
  if (a >= 1e4) return (v / 1e3).toFixed(1) + "K";
  return Number.isInteger(v) ? v.toLocaleString("en-US") : v.toLocaleString("en-US", {maximumFractionDigits: 2});
}
function money(v, cur) {
  if (!isNum(v)) return "—";
  const sym = cur === "EUR" ? "€" : "$";
  return v >= 1e9 ? sym + (v / 1e9).toFixed(2) + "B" : sym + (v / 1e6).toFixed(0) + "M";
}
function dateLabel(iso) {
  if (!iso) return "—";
  const plain = iso.length === 10;
  const d = new Date(plain ? iso + "T00:00:00Z" : iso);
  return isNaN(d) ? iso : d.toLocaleDateString("en-GB", {day: "numeric", month: "short", year: "numeric", timeZone: plain ? "UTC" : undefined});
}
const timeLabel = d => d ? d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : "—";
let toastTimer;
function toast(msg, bad) {
  document.querySelector(".toast")?.remove();
  const t = h("div", {class: "toast" + (bad ? " bad" : ""), role: "status"}, msg);
  document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 5200);
}
const dbMsg = e => e?.code === "quota_exceeded" ? "Storage is full. Delete old entries to make room."
  : e?.code === "invalid_argument" ? "Only the owner can change this." : "That did not save (" + (e?.code || "error") + "). Try again.";

/* ============================================================ DATA ACCESS */
/* When was the data last changed? The newest of: the pipeline build, an owner
   reading, a note. Shown in the top bar, the hero and the footer. */
function parseStamp(s) {
  if (!s) return null;
  const iso = /^\d{4}-\d{2}-\d{2}$/.test(s) ? s + "T00:00:00Z" : /Z|[+-]\d\d:?\d\d$/.test(s) ? s : s.replace(" ", "T") + "Z";
  const d = new Date(iso); return isNaN(d) ? null : d;
}
function lastUpdated() {
  const stamps = [S.data?.built_at, ...Object.values(S.series).map(s => s.updatedAt), ...S.notes.map(n => n.createdAt)].map(parseStamp).filter(Boolean);
  return stamps.length ? new Date(Math.max(...stamps)) : null;
}
function ago(d) {
  if (!d) return "—";
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + (m === 1 ? " minute ago" : " minutes ago");
  const hrs = Math.round(m / 60); if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
  const days = Math.round(hrs / 24); return days + (days === 1 ? " day ago" : " days ago");
}
const fullStamp = d => d ? d.toLocaleString("en-GB", {day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", timeZoneName: "short"}) : "—";
function updatedNode(prefix) {
  return h("span", {"data-ago": "1", "data-prefix": prefix || "", title: fullStamp(lastUpdated())}, (prefix || "") + ago(lastUpdated()));
}
setInterval(() => document.querySelectorAll("[data-ago]").forEach(el => {
  const d = lastUpdated(); el.textContent = (el.dataset.prefix || "") + ago(d); el.title = fullStamp(d);
}), 60000);

function companies() {
  const base = (S.data?.companies || []).map(c => ({...c, hasFin: c.hasFin ?? !!S.data?.quarters?.[c.id]?.length}));
  const ids = new Set(base.map(c => c.id));
  const extra = S.dbCompanies.filter(c => !ids.has(c.id)).map(c => ({...c, hasFin: false}));
  return [...base, ...extra];
}
const company = id => companies().find(c => c.id === id);
const quarters = id => S.data?.quarters?.[id] || [];
function latestQ(id) { const q = quarters(id); for (let i = q.length - 1; i >= 0; i--) if (isNum(q[i].rev_yoy)) return q[i]; return q.at(-1); }
const autoAvailable = sid => !!S.data?.signals?.[sid];
const applies = (sig, c) => !sig.applies || !c?.hasFin || sig.applies.includes(c.id);
/* Owner readings come from two places: files in the GitHub repository (S.data.series)

function allSeries() {
  const out = {};
  for (const src of [S.data?.series || {}, S.series]) for (const [k, s] of Object.entries(src)) {
    const prev = out[k]?.points || [], byDate = new Map(prev.map(p => [p.d, p]));
    (s.points || []).forEach(p => byDate.set(p.d, p));
    out[k] = {...s, points: [...byDate.values()]};
  }
  return out;
}
function seriesPoints(cid, sid) {
  const pts = allSeries()[cid + "__" + sid]?.points || [];
  return [...pts].filter(p => p && p.d && isNum(p.v)).sort((a, b) => a.d.localeCompare(b.d));
}
const allNotes = () => [...(S.data?.notes || []), ...S.notes];
/* One reading per (company, signal): value, change, sparkline values, status. */
function reading(cid, sig) {
  if (sig.mode === "auto" && autoAvailable(sig.id)) {
    const q = latestQ(cid), rows = quarters(cid);
    const v = q?.sig?.[sig.id]?.yoy;
    if (isNum(v)) return {status: "auto", value: pctLog(v), valueNote: "vs same quarter last year",
      change: q.sig[sig.id].accel, changeLabel: pts(q.sig[sig.id].accel) + " vs last quarter", good: v,
      spark: rows.slice(-16).map(r => r.sig?.[sig.id]?.yoy), when: "quarter ending " + dateLabel(q.end)};
  }
  const p = seriesPoints(cid, sig.id);
  if (!p.length) return {status: "none"};
  const last = p.at(-1), prev = p.at(-2);
  const t = Date.parse(last.d) - 365 * 864e5;
  const yr = p.filter(x => Math.abs(Date.parse(x.d) - t) < 50 * 864e5).at(0);
  const rel = (a, b) => isNum(a) && isNum(b) && b !== 0 ? (a - b) / Math.abs(b) : null;
  const chg = prev ? rel(last.v, prev.v) : null, yoy = yr ? rel(last.v, yr.v) : null;
  const sign = sig.better === "lower" ? -1 : 1;
  return {status: "manual", value: fmtVal(last.v), valueNote: sig.unit,
    change: isNum(chg) ? chg * sign : null,
    changeLabel: (isNum(chg) ? pctRaw(chg) + " vs previous reading" : "first reading") + (isNum(yoy) ? " · " + pctRaw(yoy) + " vs a year ago" : ""),
    good: isNum(chg) ? chg * sign : null,
    spark: p.slice(-24).map(x => x.v * sign), when: dateLabel(last.d), note: last.n};
}
function signalsWithData(cid) { const c = company(cid); return SIGNALS.filter(s => applies(s, c) && reading(cid, s).status !== "none"); }

async function loadDataset(assetId, force) {
  if (!force && S.loadedAsset === assetId && S.data) return;
  const url = assetId ? "/_blob/" + assetId : "site_data.json";
  try {
    const r = await fetch(url, {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (d.format !== "signal-engine/1" || !d.quarters || !d.companies) throw new Error("not a Signal Engine data file");
    const changed = !S.data || d.built_at !== S.data.built_at || assetId !== S.loadedAsset;
    S.data = d; S.loadedAsset = assetId; S.dataError = null; S.lastChecked = new Date();
    const autos = Object.keys(d.signals || {});
    for (const k of ["boardSignal", "coSignal", "scSignal"]) if (!autos.includes(S[k])) S[k] = autos[0];
    if (!changed && force) { renderChrome(); return; }
  } catch (e) {
    if (assetId) { S.dataError = "The uploaded data file could not be loaded (" + e.message + "). Showing the built-in data."; return loadDataset(null); }
    S.dataError = "Research data could not be loaded.";
  }

}
function checkNow() { loadDataset(S.dataset?.assetId || null, true); }
setInterval(checkNow, CHECK_EVERY_MS);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.lastChecked && Date.now() - S.lastChecked > CHECK_EVERY_MS) checkNow();
});

/* ================================================================= ROUTING */
const VIEWS = ["markets", "signals", "scorecard", "method", "console"];
function route() {

  const chips = [];
  const lu = lastUpdated(), stale = lu && Date.now() - lu > 8 * 864e5;
  chips.push(h("span", {class: "chip " + (stale ? "stale" : "live"),
      title: "Data last updated " + fullStamp(lu) + ". This page checks for new data every 30 minutes (last check " + timeLabel(S.lastChecked) + ")."},
    h("span", {class: "dot"}), updatedNode("Updated ")));
  const nm = S.me?.name;

  else if (S.isOwner) chips.push(h("span", {class: "chip owner"}, "Owner" + (nm ? " · " + nm : "")));
  else if (S.me?.id) chips.push(h("span", {class: "chip"}, "Signed in" + (nm ? " · " + nm : "")));
  document.getElementById("status").replaceChildren(...chips);
  renderTape();
  const fd = document.getElementById("foot-data");
  if (S.data) fd.replaceChildren((S.data.mode === "live" ? "Live data" : "Synthetic test data") + " · last updated " + fullStamp(lastUpdated()) + " · checked " + timeLabel(S.lastChecked));
}
function renderTape() {
  const tape = document.getElementById("tape");
  if (!S.data) { tape.replaceChildren(); return; }
  const items = companies().map(c => {
    const q = latestQ(c.id), sigs = signalsWithData(c.id).slice(0, 2);
    if (!q && !sigs.length) return null;
    return h("span", {class: "tick"}, h("b", {}, c.id),
      q ? [h("span", {}, "Revenue"), h("em", {class: dir(q.rev_yoy)}, arrow(q.rev_yoy) + pctLog(q.rev_yoy))] : null,
      sigs.map(s => { const r = reading(c.id, s); return [h("span", {}, s.name), h("em", {class: dir(r.good)}, arrow(r.good) + (r.status === "auto" ? r.value : r.changeLabel.split(" vs")[0]))]; }));

  if (S.dataError) parts.push(h("div", {class: "banner"}, h("b", {}, "Data"), S.dataError));

  const view = {markets: viewMarkets, signals: viewSignals, company: () => viewCompany(r.id), scorecard: viewScorecard, method: viewMethod, console: viewConsole}[r.view]();
  app.replaceChildren(...parts, view);
  fill();
}
function fill() {
  document.querySelectorAll("[data-slot]").forEach(el => { const f = SLOTS[el.dataset.slot]; if (f) el.replaceChildren(...[f(el.dataset.arg)].flat()); });
}
const SLOTS = {
  notes: n => notesList(+n || 3),
  record: () => trackRecord(),
  forecasts: () => forecastList(),
  dataset: () => datasetStatus(),
  seriesTable: () => seriesTable(),

/* ----- Markets */
function viewMarkets() {
  const cs = companies();
  const manualPoints = Object.values(allSeries()).reduce((a, s) => a + (s.points?.length || 0), 0);
  const withData = new Set(); cs.forEach(c => signalsWithData(c.id).forEach(s => withData.add(s.id)));
  const hero = h("section", {class: "hero"},
    h("div", {class: "stack"},

function barsSVG(sig) {
  const b = (S.data.breakdown || []).filter(r => r.signal === sig && isNum(r.spearman)).sort((p, q) => q.spearman - p.spearman);
  if (!b.length) return `<p class="muted">No per-company results for this signal yet.</p>`;
  const W = 820, rowH = 30, T = 26, H = T + b.length * rowH + 8, L = 150, R = 60, mid = L + (W - L - R) / 2, half = (W - L - R) / 2;
  const col = cu => cu === "Consumer" ? "var(--accent)" : cu === "Business" ? "var(--info)" : "var(--faint)";
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto;display:block" role="img" aria-label="Per-company result for ${esc(SIG[sig]?.name || sig)}">`;
  [-1, -.5, 0, .5, 1].forEach(t => { const xx = mid + t * half;
    s += `<line x1="${xx}" x2="${xx}" y1="${T - 6}" y2="${H - 6}" stroke="var(--line)" ${t === 0 ? "" : 'stroke-dasharray="2 4"'}/><text x="${xx}" y="${T - 12}" text-anchor="middle" font-size="11" font-family="var(--mono)" fill="var(--muted)">${t > 0 ? "+" : ""}${t}</text>`; });
  b.forEach((r, i) => {

    const yy = T + i * rowH + 4, w = Math.abs(r.spearman) * half, x0 = r.spearman >= 0 ? mid : mid - w;
    s += `<text x="${L - 12}" y="${yy + 15}" text-anchor="end" font-size="13" fill="var(--fg)">${esc(c.name)}</text>
      <rect x="${x0.toFixed(1)}" y="${yy + 3}" width="${Math.max(w, 1.5).toFixed(1)}" height="${rowH - 12}" rx="3" fill="${col(c.customer)}"/>
      <text x="${(r.spearman >= 0 ? mid + w + 6 : mid - w - 6).toFixed(1)}" y="${yy + 15}" text-anchor="${r.spearman >= 0 ? "start" : "end"}" font-size="11.5" font-family="var(--mono)" fill="var(--muted)">${fmtSigned(r.spearman, 2)}</text>`;

        f.outcome === "pending" ? [h("button", {class: "btn small", type: "button", onclick: () => grade(f, "hit")}, "Right"), h("button", {class: "btn small", type: "button", onclick: () => grade(f, "miss")}, "Wrong")]
          : h("button", {class: "btn small", type: "button", onclick: () => grade(f, "pending")}, "Undo"),
        confirmButton("Delete", "Confirm", async () => { try { await S.db.doc("forecasts/" + f.id).delete(); } catch (e) { toast(dbMsg(e), true); } })))));
}
async function grade(f, outcome) {
  try { await S.db.doc("forecasts/" + f.id).update({outcome, gradedAt: outcome === "pending" ? null : new Date().toISOString()}); } catch (e) { toast(dbMsg(e), true); }
}
async function publishDataset(file) {
  if (!S.assets || !S.db) return toast("Uploading is only available to the owner on claude.ai.", true);
  let text, d;
  try { text = await file.text(); d = JSON.parse(text); } catch { return toast("That file is not valid JSON. Upload data/site_data.json from the pipeline.", true); }
  if (d.format !== "signal-engine/1" || !d.quarters || !d.companies) return toast("That is not a Signal Engine data file. Upload data/site_data.json from the pipeline.", true);
  toast("Uploading " + file.name + "…");
  try {
    const res = await S.assets.upload(new Blob([text], {type: "application/json"}), {type: "application/json"});
    await S.db.doc("site/dataset").set({assetId: res.id, mode: d.mode || "unknown", builtAt: d.built_at || null, uploadedAt: new Date().toISOString(), source: "manual"});
    toast("Published. Visitors now see " + (d.mode === "live" ? "real" : "test") + " data built " + (d.built_at || "recently") + ".");
  } catch (e) { toast(e?.code === "too_large" ? "File is too large (limit 20 MB)." : "Upload failed (" + (e?.code || "error") + "). Try again.", true); }
}
async function revertDataset() {
  try { await S.db.doc("site/dataset").set({assetId: null, mode: "demo", builtAt: null, uploadedAt: new Date().toISOString(), source: "manual"}); toast("Switched back to built-in test data."); }
  catch (e) { toast(dbMsg(e), true); }
}

/* ============================================================ CAPABILITIES */
async function connect() {
  const C = window.claude;
  if (!C || typeof C.use !== "function") return;
  const user = await C.use("user");
  if (user) { S.isOwner = await user.isOwner(); S.me = await user.me(); renderChrome(); if (S.isOwner) mount(); }
  const db = await C.use("db");
  if (db) {
    S.db = db;
    db.doc("site/dataset").onSnapshot(snap => {
      S.live = true; S.dataset = snap.exists ? snap.data() : null;
      const id = S.dataset?.assetId || null;
      if (id !== (S.loadedAsset ?? null)) loadDataset(id); else { renderChrome(); fill(); }
    }, () => { S.live = false; renderChrome(); });
    db.collection("series").onSnapshot(qs => {
      S.series = Object.fromEntries(qs.docs.map(d => [d.id, d.data()])); S.seriesReady = true; refresh();
    }, () => { S.seriesReady = true; });
    db.collection("companies").onSnapshot(qs => { S.dbCompanies = qs.docs.map(d => d.data()).filter(c => c?.id); refresh(); }, () => {});
    db.collection("notes").onSnapshot(qs => { S.notes = qs.docs.map(d => ({id: d.id, ...d.data()})); S.notesReady = true; fill(); }, () => { S.notesReady = true; fill(); });
    if (S.isOwner) db.collection("forecasts").onSnapshot(qs => { S.forecasts = qs.docs.map(d => ({id: d.id, ...d.data()})); S.fcReady = true; fill(); }, () => { S.fcReady = true; fill(); });
  }
  if (S.isOwner) S.assets = await C.use("assets");
  mount();
}

/* ======================================================= BACKGROUND FIELD */
(function background() {
  const cv = document.getElementById("bg"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, cols = {}, offset = 0, candles = [], last = 0, raf;
  const readColors = () => { const cs = getComputedStyle(document.documentElement); cols = {line: cs.getPropertyValue("--line").trim(), up: cs.getPropertyValue("--up").trim(), down: cs.getPropertyValue("--down").trim(), accent: cs.getPropertyValue("--accent").trim()}; };
  const next = p => { const o = p, c = p + (H * 0.55 - p) * 0.02 + (Math.random() - 0.5) * 22; return {o, c, hi: Math.min(o, c) - Math.random() * 14, lo: Math.max(o, c) + Math.random() * 14}; };
  const seed = () => { candles = []; let p = H * 0.55; for (let i = 0; i < Math.ceil(W / 14) + 40; i++) { candles.push(next(p)); p = candles.at(-1).c; } };
  function size() { const dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); seed(); draw(); }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = 0.5; ctx.strokeStyle = cols.line; ctx.lineWidth = 1;
    for (let gx = 0; gx < W; gx += 64) { ctx.beginPath(); ctx.moveTo(gx + .5, 0); ctx.lineTo(gx + .5, H); ctx.stroke(); }
    for (let gy = 0; gy < H; gy += 64) { ctx.beginPath(); ctx.moveTo(0, gy + .5); ctx.lineTo(W, gy + .5); ctx.stroke(); }
    ctx.globalAlpha = 0.16;
    candles.forEach((k, i) => { const x = i * 14 - offset; if (x < -14 || x > W + 14) return;
      ctx.strokeStyle = ctx.fillStyle = k.c < k.o ? cols.up : cols.down;
      ctx.beginPath(); ctx.moveTo(x + 4.5, k.hi); ctx.lineTo(x + 4.5, k.lo); ctx.stroke(); ctx.fillRect(x + 1, Math.min(k.o, k.c), 7, Math.max(Math.abs(k.c - k.o), 1.5)); });
    ctx.globalAlpha = 0.22; ctx.strokeStyle = cols.accent; ctx.lineWidth = 1.5; ctx.beginPath();
    let avg = candles[0]?.c || 0;
    candles.forEach((k, i) => { avg = avg * 0.85 + k.c * 0.15; const x = i * 14 - offset + 4.5; i ? ctx.lineTo(x, avg - 40) : ctx.moveTo(x, avg - 40); });
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  function tick(t) { raf = requestAnimationFrame(tick); if (t - last < 33) return; last = t; offset += 0.35;
    if (offset >= 14) { offset -= 14; candles.shift(); candles.push(next(candles.at(-1).c)); } draw(); }
  readColors(); size(); addEventListener("resize", size);
  const recolor = () => { readColors(); draw(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", recolor);
  new MutationObserver(recolor).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
  if (!reduce) { raf = requestAnimationFrame(tick); document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); if (!document.hidden) raf = requestAnimationFrame(tick); }); }
})();

/* ==================================================================== BOOT */
renderChrome();
loadDataset(null);
connect();
</script>
